name: Linters Verification
run-name: ${{ github.actor }} is running linters
on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      
      - name: Set up Python
        run: uv python install
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run mypy
        run: uv run mypy compute_sales.py
        continue-on-error: false
      
      - name: Run pylint
        run: uv run pylint compute_sales.py
        continue-on-error: false
      
      - name: Run flake8
        run: uv run flake8 compute_sales.py
        continue-on-error: false